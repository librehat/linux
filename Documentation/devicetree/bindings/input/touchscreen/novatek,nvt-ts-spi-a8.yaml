%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/novatek,nvt-ts-spi-a8.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NT36523B SPI Host-Download Touchscreen (Samsung Galaxy Tab A8)

maintainers:
  - Simeon Huang <hzwhuang@gmail.com>

properties:
  compatible:
    const: novatek,NVT-ts-spi-a8

  reg:
    maxItems: 1

  spi-max-frequency: true

  novatek,swrst-n8-addr:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Register address for N8 software reset command.

  novatek,spi-rd-fast-addr:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Register address for fast SPI read prefix.

  novatek,resolution:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 2
    maxItems: 2
    description: Panel touch X and Y resolution in pixels.

  novatek,area-size:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 3
    maxItems: 3
    description: Touch pressure/area scaling parameters.

  novatek,max_touch_num:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Maximum number of simultaneous touch slots.

  novatek,reset-gpio:
    maxItems: 1

  novatek,irq-gpio:
    maxItems: 1

  novatek,fw_name:
    $ref: /schemas/types.yaml#/definitions/string
    description: Host-download firmware filename under /lib/firmware.

required:
  - compatible
  - reg
  - novatek,reset-gpio
  - novatek,irq-gpio

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    spi {
        #address-cells = <1>;
        #size-cells = <0>;
        touchscreen@1 {
            compatible = "novatek,NVT-ts-spi-a8";
            reg = <1>;
            spi-max-frequency = <9600000>;
            novatek,swrst-n8-addr = <0x0003f0fe>;
            novatek,spi-rd-fast-addr = <0x0003f310>;
            novatek,resolution = <1200 1920>;
            novatek,area-size = <0x38 0x70 0x3c>;
            novatek,max_touch_num = <10>;
            novatek,reset-gpio = <&ap_gpio 145 GPIO_ACTIVE_HIGH>;
            novatek,irq-gpio = <&eic_async 0 IRQ_TYPE_EDGE_RISING>;
            novatek,fw_name = "nt36523b_qc_inx_fw.bin";
        };
    };
...
