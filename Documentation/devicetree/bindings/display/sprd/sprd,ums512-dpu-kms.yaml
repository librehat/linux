%YAML 1.2
---
$id: http://devicetree.org/schemas/display/sprd/sprd,ums512-dpu-kms.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS512 DPU KMS (bootloader-initialised DSI)

maintainers:
  - Simeon Huang <hzwhuang@gmail.com>

properties:
  compatible:
    const: sprd,ums512-dpu-kms

  reg:
    minItems: 1
    maxItems: 3

  interrupts:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 4

  clock-names:
    items:
      - const: core
      - const: clk
      - const: dpi
      - const: dsi

  width-mm: true

  height-mm: true

  rotation:
    description:
      Display rotation in degrees counter clockwise (0, 90, 180, 270)
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 90, 180, 270]

  sprd,boot-framebuffer:
    $ref: /schemas/types.yaml#/definitions/phandle

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false
